<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Decorative Grid Pattern in Background -->
  <g opacity="0.08">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Data Flow Curves (Background animation) -->
  <g opacity="0.4">
    <!-- Stream 1 -->
    <path d="M -50,300 Q 250,220 500,260 T 1000,180 T 1250,120" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Stream 2 -->
    <path d="M -50,100 Q 300,40 650,90 T 1150,40 T 1300,80" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="200" dur="14s" repeatCount="indefinite" />
    </path>
    <!-- Stream 3 (Cyan Neon) -->
    <path d="M -50,340 Q 350,310 750,330 T 1250,290" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 14" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="18s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Ambient Pulsing Glow Orbs in Background -->
  <circle cx="200" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="100;140;100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="270" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.09;0.18;0.09" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== FOREGROUND CONTENT ==================== -->

  <!-- Top Category Tag -->
  <g transform="translate(60, 48)">
    <rect width="268" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="badge-text" fill="#38bdf8">ENTERPRISE CLOUD ARCHIVING</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="125" class="title-text">
    Awesome Cloud Data Archiving
  </text>
  <text x="60" y="172" class="title-text" fill="url(#accentGrad)">
    &amp; Cold Storage Solutions ❄️
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="214" class="subtitle-text">
    Curated SaaS, Tape, Glacier &amp; Open-Source Tiering Platforms for Long-Term Data Retention
  </text>

  <!-- Interactive / Dynamic Status Badges (Pills) -->
  <g transform="translate(60, 248)">
    <!-- Pill 1: Glacier / Deep Archive -->
    <g transform="translate(0, 0)">
      <rect width="180" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#38bdf8" />
      <text x="16" y="24" class="metric-label">Lowest Cold Tier</text>
      <text x="16" y="47" class="metric-val">$0.00099 / GB</text>
    </g>

    <!-- Pill 2: Zero Egress -->
    <g transform="translate(196, 0)">
      <rect width="180" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#818cf8" />
      <text x="16" y="24" class="metric-label">Zero Egress Options</text>
      <text x="16" y="47" class="metric-val" fill="#818cf8">Wasabi &amp; Lyve Cloud</text>
    </g>

    <!-- Pill 3: Durability Rating -->
    <g transform="translate(392, 0)">
      <rect width="180" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#34d399" />
      <text x="16" y="24" class="metric-label">Data Durability</text>
      <text x="16" y="47" class="metric-val" fill="#34d399">99.999999999%</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(588, 0)">
      <rect width="180" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#c084fc" />
      <text x="16" y="24" class="metric-label">Open-Source Tech</text>
      <text x="16" y="47" class="metric-val" fill="#c084fc">Rclone, Restic &amp; Tape</text>
    </g>
  </g>

  <!-- Right Hero Graphic: Cold Archive Vault Vault Node -->
  <g transform="translate(940, 50)">
    <!-- Floating Rack Unit 1 (Active Cloud) -->
    <g transform="translate(0, 0)">
      <rect width="190" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
      <circle cx="22" cy="26" r="6" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#ffffff">HOT TIER OBJECT</text>
      <text x="38" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Instant Access (ms)</text>
    </g>

    <!-- Data Migration Arrow 1 -->
    <g transform="translate(95, 54)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.5s" repeatCount="indefinite" />
      </line>
      <polygon points="-4,20 4,20 0,26" fill="#38bdf8" />
    </g>

    <!-- Floating Rack Unit 2 (Cool Archive) -->
    <g transform="translate(0, 84)">
      <rect width="190" height="52" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.95" />
      <circle cx="22" cy="26" r="6" fill="#818cf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#ffffff">WARM / COOL TIER</text>
      <text x="38" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Lifecycle Rule (~30d)</text>
    </g>

    <!-- Data Migration Arrow 2 -->
    <g transform="translate(95, 138)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.5s" repeatCount="indefinite" />
      </line>
      <polygon points="-4,20 4,20 0,26" fill="#818cf8" />
    </g>

    <!-- Floating Rack Unit 3 (Deep Freeze Vault / Tape) -->
    <g transform="translate(0, 168)">
      <rect width="190" height="58" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.8" opacity="0.95" />
      <circle cx="22" cy="29" r="6" fill="#c084fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#c084fc">COLD VAULT &amp; TAPE ❄️</text>
      <text x="38" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#cbd5e1">Deep Archive &amp; Air-Gap</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" />
</svg>
